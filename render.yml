services:
  - type: web
    name: financial-ai-api
    runtime: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://agentic-finance-explorer-zrkwkgnuyidyfgbqc8jb4a.streamlit.app